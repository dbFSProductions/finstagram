# Optional: rebuild the 40-post feed on a schedule and publish public/ to GitHub Pages.
# Enable it once in the repo: Settings → Pages → Source → "GitHub Actions".
name: Publish feed to GitHub Pages

on:
  schedule:
    - cron: '17 */2 * * *'   # keep FEED_SCHEDULE below in step: the app shows it as "next build"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Which posts earlier builds already showed, so each build replaces all of them.
      - uses: actions/cache@v4
        with:
          path: .cache/history.json
          key: feed-history-${{ github.run_id }}
          restore-keys: feed-history-
      - run: npm run build
        env:
          FEED_SCHEDULE: '17 */2 * * *'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
